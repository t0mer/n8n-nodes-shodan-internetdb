# Publishes the package to npm with a provenance attestation on every version tag push.
#
# Authentication is npm Trusted Publishing (OIDC): no npm token is stored in this repo.
#
# One-time setup:
#   1. Publish the first version manually so the scoped package exists:
#        npm run build && RELEASE_MODE=true npm publish --access public --provenance=false
#   2. On npmjs.com → @t0mer/n8n-nodes-shodan-internetdb → Settings → Trusted Publishers,
#      add GitHub Actions: owner "t0mer", repository "n8n-nodes-shodan-internetdb",
#      workflow "publish.yml", environment left blank.
#   3. From then on, release only through this workflow.
#
# Releasing: `npm run release` (bump to the next YYYY.M.PATCH version, update
# PACKAGE_VERSION in shared/constants.ts to match), which commits, tags, and pushes.
# The pushed tag triggers this workflow.

name: Publish

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint the OIDC token for trusted publishing and provenance.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1.
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Release
        # `n8n-node release` in CI runs lint and build, then `npm publish` with provenance.
        run: npm run release
