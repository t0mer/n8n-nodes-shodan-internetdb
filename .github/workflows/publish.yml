# Releases the package: computes the next YYYY.M.PATCH version, publishes to npm with a
# provenance attestation, then tags the commit and creates a GitHub Release.
#
# Run it from the Actions tab (Release → Run workflow). Leave "version" blank to
# auto-increment from the latest tag of the current month (2026.9.0 → 2026.9.1 → …).
# The git tag is the source of truth; package.json in the repo is not bumped.
#
# Authentication is npm Trusted Publishing (OIDC): no npm token is stored in this repo.
#
# One-time setup:
#   1. Publish the first version manually so the scoped package exists, then tag it:
#        npm run build && RELEASE_MODE=true npm publish --access public --provenance=false
#        git tag 2026.9.0 && git push origin 2026.9.0
#   2. On npmjs.com → @t0mer/n8n-nodes-shodan-internetdb → Settings → Trusted Publishers,
#      add GitHub Actions: owner "t0mer", repository "n8n-nodes-shodan-internetdb",
#      workflow "publish.yml", environment left blank.
#   3. From then on, release only through this workflow.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (YYYY.M.PATCH). Leave blank to auto-increment.'
        required: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # OIDC token for trusted publishing and provenance.
      id-token: write
      # Push the version tag and create the GitHub Release.
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # all tags are needed to compute the version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1.
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }} # via env: injection-safe
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION:-$(./scripts/next-version.sh)}"
          [[ "$VERSION" =~ ^[0-9]{4}\.[1-9][0-9]?\.[0-9]+$ ]] || { echo "::error::invalid version '$VERSION' (expected YYYY.M.PATCH)"; exit 1; }
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::tag $VERSION already exists"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

      - name: Set package version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build and test
        run: |
          npm run build
          npm test

      - name: Publish
        # `n8n-node release` in CI runs lint and build, then `npm publish` with provenance.
        run: npm run release

      # Tag only after a successful publish, so a failed run never burns a version.
      - name: Tag and create GitHub Release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION"
          git push origin "$VERSION"
          gh release create "$VERSION" --title "$VERSION" --generate-notes
